<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strava Streets</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <h1>Strava Streets</h1>
      <p class="tagline">Street View on Route Builder</p>
    </header>

    <section class="controls" aria-label="Feature controls">
      <label class="row">
        <span>Street View / Pano</span>
        <input type="checkbox" id="feature-enabled" />
      </label>
      <fieldset class="row map-click-button">
        <legend>Set Anchor with</legend>
        <div class="segmented" role="radiogroup" aria-label="Map Click Button">
          <label>
            <input type="radio" name="map-click-button" value="left" id="map-click-left" />
            Left click
          </label>
          <label>
            <input type="radio" name="map-click-button" value="right" id="map-click-right" checked />
            Right click
          </label>
        </div>
      </fieldset>
      <p class="hint">
        Left click still draws the route on Strava. Choose which button moves the Pano.
      </p>
    </section>

    <section class="account" aria-label="Account">
      <div class="row">
        <span>Account</span>
        <span id="account-status" class="muted">Not connected</span>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
